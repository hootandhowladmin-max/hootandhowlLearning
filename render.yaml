services:
  - type: web
    name: hootandhowl-server
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_OPTIONS
        value: ""
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: MAIL_PROVIDER
        value: mailgun
    docker:
      dockerfile: ./Dockerfile
